/* ===== docs shell — outside the token system so chrome never re-themes ===== */
:root{--doc-bg:#0f0f10;--doc-panel:#161617;--doc-text:#f4f2ee;--doc-dim:#9a9a94;--doc-faint:#6b6b66;--doc-line:rgba(255,255,255,.09);--doc-sky:#a8d8f0;
--doc-aurora:linear-gradient(115deg,#f0a8c0 0%,#f5b880 22%,#c9b8f0 48%,#9fe8d0 74%,#a8d8f0 100%)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Avenir Next",Avenir,"Century Gothic",Futura,-apple-system,sans-serif;background:var(--doc-bg);color:var(--doc-text);-webkit-font-smoothing:antialiased}
.topbar{position:fixed;top:0;left:0;right:0;z-index:30;height:56px;background:#0b0b0c;border-bottom:1px solid var(--doc-line);display:flex;align-items:center;gap:18px;padding:0 22px}
.topbar a.tl{color:var(--doc-faint);text-decoration:none;font-size:12px}
.topbar a.tl:hover{color:var(--doc-text)}
.topbar .t{font-size:15px;font-weight:600}
.topbar .t em{font-style:normal;background:var(--doc-aurora);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.layout{display:flex;padding-top:56px}
aside{width:262px;flex:0 0 262px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;border-right:1px solid var(--doc-line);background:var(--doc-panel);padding:14px 10px 60px}
.nav-sec{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--doc-faint);padding:16px 14px 6px}
aside a{display:block;padding:6px 14px;border-radius:8px;color:var(--doc-dim);text-decoration:none;font-size:12.5px;line-height:1.45}
aside a:hover{background:rgba(255,255,255,.05);color:var(--doc-text)}
aside a.on{background:rgba(91,91,214,.2);color:var(--doc-text)}
main{flex:1;min-width:0}

.page-head{background:#0b0b0c;border-bottom:1px solid var(--doc-line);padding:34px 52px 0}
.page-head.notabs{padding-bottom:26px}
.crumb{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--doc-faint);margin-bottom:8px}
h1{font-size:38px;font-weight:400;letter-spacing:-.01em;line-height:1.12;margin-bottom:22px}
.prov{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;border-radius:99px;padding:5px 11px;vertical-align:9px;font-weight:600}
.prov.today{color:#7fd6a4;border:1px solid rgba(127,214,164,.4)}
.prov.new{color:#f0b8d0;border:1px solid rgba(240,184,208,.4)}
.prov.extended{color:var(--doc-sky);border:1px solid rgba(168,216,240,.4)}
.ptabs{display:flex;gap:0}
.ptabs button{font-family:inherit;font-size:13.5px;background:none;border:none;border-bottom:2px solid transparent;color:var(--doc-dim);padding:12px 20px;cursor:pointer;margin-bottom:-1px}
.ptabs button:hover{color:var(--doc-text);background:rgba(255,255,255,.03)}
.ptabs button.on{color:var(--doc-text);border-bottom-color:var(--doc-sky);background:rgba(255,255,255,.05)}
.page-body{padding:36px 52px 110px;max-width:1000px}

h2{font-size:21px;font-weight:600;margin:38px 0 10px}
h2:first-child{margin-top:0}
p.desc{font-size:14.5px;color:var(--doc-dim);line-height:1.7;max-width:70ch;margin-bottom:8px}
p.desc b,p.desc strong{color:var(--doc-text);font-weight:600}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--doc-sky)}
a.deep{color:var(--doc-sky);text-decoration:none}
a.deep:hover{text-decoration:underline}

.demo-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--doc-panel);border:1px solid var(--doc-line);border-bottom:none;border-radius:12px 12px 0 0;padding:10px 14px;margin-top:14px}
.demo-bar label{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--doc-faint)}
.demo-bar select{font-family:inherit;font-size:12.5px;background:#0f0f10;color:var(--doc-text);border:1px solid var(--doc-line);border-radius:8px;padding:6px 10px}
.demo-bar .sp{margin-left:auto;font-size:11.5px}
.frame{border:1px solid var(--doc-line);border-radius:0 0 12px 12px;overflow:hidden;background:#141414}
.frame iframe{width:100%;border:0;display:block;min-height:180px}

.blocks{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.blk{background:var(--doc-panel);border:1px solid var(--doc-line);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.7;color:var(--doc-dim)}
.blk b{color:var(--doc-text)}
.choose{background:var(--doc-panel);border:1px solid var(--doc-line);border-radius:12px;padding:14px 16px}
.choose .q{font-size:14px;font-weight:600;color:var(--doc-text);margin-bottom:3px}
.choose .v{font-size:12.5px;color:var(--doc-sky);margin-bottom:6px}
.choose .w{font-size:12.5px;line-height:1.6;color:var(--doc-dim)}
table.dt{width:100%;border-collapse:collapse;font-size:13px;background:var(--doc-panel);border:1px solid var(--doc-line);border-radius:12px;overflow:hidden;margin-top:10px}
table.dt th{text-align:left;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--doc-faint);padding:11px 16px;border-bottom:1px solid var(--doc-line);font-weight:600}
table.dt td{padding:11px 16px;border-bottom:1px solid var(--doc-line);color:var(--doc-dim);line-height:1.6;vertical-align:top}
table.dt tr:last-child td{border-bottom:none}
table.dt td:first-child{color:var(--doc-text);font-weight:500}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}
.sw{border-radius:10px;overflow:hidden;border:1px solid var(--doc-line)}
.sw-chip{height:50px}
.sw-meta{background:var(--doc-panel);padding:8px 10px;font-size:11px}
.sw-meta b{display:block;font-weight:600}
.sw-meta code{display:block;color:var(--doc-faint);font-size:9.5px;margin-top:3px;word-break:break-all}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin:22px 0}
.stat b{display:block;font-size:28px;font-weight:300;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--doc-faint)}
.pcards{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}
.pcard{flex:1;min-width:230px;background:var(--doc-panel);border:1px solid var(--doc-line);border-radius:12px;padding:16px}
.pcard .n{font-size:10px;letter-spacing:.16em;color:var(--doc-faint)}
.pcard b{display:block;font-size:14.5px;margin:6px 0 7px}
.pcard p{font-size:12.5px;line-height:1.6;color:var(--doc-dim)}
pre.tree{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.75;color:var(--doc-dim);margin:6px 0 0}
.empty{font-size:13.5px;color:var(--doc-faint);line-height:1.7;background:var(--doc-panel);border:1px dashed var(--doc-line);border-radius:12px;padding:18px}
@media(max-width:900px){aside{display:none}.page-head{padding:24px 18px 0}.page-body{padding:24px 18px 70px}.ptabs{overflow-x:auto}}
</style>
</head>

<script>
const PAGES = {"06-scenarios-application-entry":{"section":"06 Scenarios","leaf":"Application entry","variants":[{"name":"Signup Form","id":"06-scenarios-application-entry--signup-form"}],"docsId":"06-scenarios-application-entry--docs","usage":null,"style":null,"a11y":null,"tokens":[],"classes":[]},"04-patterns-ai-explain-recommend-confirm-act":{"section":"04 Patterns","leaf":"AI: explain, recommend, confirm, act","variants":[{"name":"Insight Anatomy","id":"04-patterns-ai-explain-recommend-confirm-act--insight-anatomy"},{"name":"Confirm Before Action","id":"04-patterns-ai-explain-recommend-confirm-act--confirm-before-action"},{"name":"Human Escalation","id":"04-patterns-ai-explain-recommend-confirm-act--human-escalation"}],"docsId":"04-patterns-ai-explain-recommend-confirm-act--docs","usage":{"intro":"One anatomy for every AI moment: <b>Explain → Recommend → Confirm → Act</b>. The AI may observe, explain and recommend freely; anything consequential requires explicit confirmation first.","rules":["The data used is always shown. An AI that will not say what it looked at cannot be checked.","Recommendations show the math, not a verdict.","Moving money, selling assets, changing the repayment source and modifying card settings <b>all require confirmation</b> — no exceptions, no “remember my choice”.","The assistant’s name is white-labelable; its decision boundaries are not.","Every acted-on recommendation is logged, and the member can reverse it within a stated window."],"states":[["Quiet","Nothing needs the member — the AI says so and stops."],["Nudge","A structural improvement offered once, dismissible."],["Intervene","The math shown with options, none pre-selected."],["Acted","Confirmation of what happened and how to undo it."]]},"style":[["AI voice","`sys.color.text.ai` (mint) for the AI’s reasoning — distinct from member content and system chrome."],["Sources","`sys.color.ai.source` at legal type size, always present."],["Never","The AI never uses the status palette to make a recommendation feel urgent."]],"a11y":[["Announcement","Proactive insights arrive in a polite live region — they inform, they do not interrupt."],["Confirmation","The confirm action states the outcome in its accessible name (“Confirm — pay S$8,400 from settlement”), not just “Confirm”."],["Dismissal","Every AI surface is dismissible by keyboard, and dismissal is remembered."],["Not colour-dependent","The mint AI voice is a convention, never the only signal that content is machine-generated — the source line says so in words."]],"tokens":[],"classes":[{"name":"arta-ai-text","decls":1}]},"02-components-sheets":{"section":"02 Components","leaf":"Sheets","variants":[{"name":"Bottom sheet · Legal Sheet","id":"02-components-sheets-bottom-sheet--legal-sheet"}],"docsId":"02-components-sheets-bottom-sheet--docs","usage":{"intro":"Arta’s existing container for long legal reading, carried into lending. A sheet is for <b>a document the member must be able to read in full</b> — never for a form step, which belongs in the flow.","anatomy":"Drag handle · display title · body with real reading measure · <b>scroll-to-read affordance</b> · confirm action pinned to the bottom.","rules":["The scroll affordance disappears only when the member has reached the end — it doubles as the signal that reading is complete.","The confirm action is pinned and always visible, so the member is never hunting for it after a long scroll.","Legal text inside a sheet uses the legal type style; it is never reduced to fit more on screen.","A sheet never traps: it is dismissible, and dismissing does not lose the member’s place in the flow."],"states":[["Opening","Rises from the bottom with `motion.surface`; scrim fades in."],["Scrollable","Scroll-to-read affordance visible."],["Read to end","Affordance hides; confirm action becomes the only next step."]]},"style":[["Surface","`sys.color.surface.sheet` — near-black, deliberately quieter than the gradient world behind it."],["Radius","Top corners only, `radius.media`."],["Handle","40px wide, `stroke.strong` — Arta’s existing signature for a draggable sheet."]],"a11y":[["Dialog semantics","`role=\"dialog\"` with `aria-modal`, labelled by the sheet title."],["Focus management","Focus moves into the sheet on open and returns to the trigger on close; focus is trapped while open."],["Dismissal","Escape closes it, and the scrim is clickable — a modal that can only be closed by agreeing is a dark pattern."],["Scroll affordance","Also operable by keyboard, and not the only way to reach the end of the content."]],"tokens":[{"name":"sheet.bg","value":"arta.sys.color.surface.sheet"},{"name":"sheet.radius","value":"arta.sys.radius.media"},{"name":"sheet.pad","value":"arta.sys.space.stack-lg"},{"name":"sheet.handle-bg","value":"arta.sys.color.stroke.strong"},{"name":"sheet.handle-width","value":"arta.ref.space.10"},{"name":"sheet.scrim","value":"arta.ref.color.alpha.black-48"}],"classes":[{"name":"arta-sheet","decls":3}]},"02-components-form-controls":{"section":"02 Components","leaf":"Form controls","variants":[{"name":"Button · Primary","id":"02-components-form-controls-button--primary"},{"name":"Button · Secondary","id":"02-components-form-controls-button--secondary"},{"name":"Button · Disabled","id":"02-components-form-controls-button--disabled"},{"name":"Button · All States","id":"02-components-form-controls-button--all-states"},{"name":"Input","id":"02-components-form-controls-input--states"},{"name":"Input · Sensitive Moment","id":"02-components-form-controls-input--sensitive-moment"},{"name":"Builder controls","id":"02-components-form-controls-builder-controls--states"}],"docsId":"02-components-form-controls-button--docs","usage":{"intro":"Arta’s controls were built for a product you <b>browse</b>. A lending application is a product you <b>fill in</b> — so this family adds the states a browse-first system never needed: error, disabled-with-a-reason, and focus that survives a screenshot.","anatomy":"Label (caps micro) · control · helper or error line. The helper line is <b>reserved space</b> — it never appears and disappears, because a form that shifts as you type feels broken.","choose":[["Primary action on a working surface","Button — inverse pill","White on Arta, navy on Meridian. The in-app convention, not the marketing site’s sky fill."],["Primary action on a gradient surface","Button — on-gradient white pill","Always white here: a theme’s inverse colour would sink into a dark partner gradient."],["Free text or a number","Input — filled","On charcoal working surfaces, where contrast does the work."],["Free text on a brand surface","Input — outline","Transparent fill, translucent stroke; focus brightens the stroke to full white."],["An amount of money","Input — currency","Prefix inside the field, no cents, separators appear as you type."]],"rules":["Error is <b>coral stroke + a sentence</b> directly below the field. Never a colour alone, never a tooltip, never a summary bumped to the top of the form.","An error sentence says what to do, not what went wrong: “Enter a valid email”, not “Invalid input”.","Disabled always carries a reason nearby. A disabled control with no explanation is a dead end the member cannot escape.","A submit button states what it does, not what the member hopes for: “Submit application”, never “Get my card”."],"states":[["Rest","Full-contrast label, resting stroke."],["Hover","Stroke brightens one step."],["Focus","Stroke goes to the focus colour and thickens; the ring is always visible."],["Error","Coral stroke plus a sentence; the label stays legible and is not recoloured."],["Disabled","Reduced opacity, pointer disabled, reason adjacent."],["Loading","The label persists — a button never collapses to a bare spinner."]]},"style":[["Height","Controls are 52px (`size.control`); compact contexts use 44px. Both clear the 44px touch minimum."],["Radius","Buttons take `radius.action` (pill on Arta, 8px on Meridian); inputs take `radius.control`."],["Label","Caps micro-label, `letter-spacing.caps`. This is Arta’s existing voice, carried into forms."],["Error colour","`sys.color.status.danger` — a platform semantic, identical in every theme."],["Motion","`motion.control` (120ms) on stroke and fill; no motion on layout, so the form never reflows."]],"a11y":[["Focus visibility","The focus ring is never removed. A partner theme may recolour `action.focus-ring`; the build rejects a theme that tries to disable it."],["Target size","Minimum 44 × 44px at every breakpoint, including the icon button."],["Error announcement","The message sits in the DOM immediately after the input and is associated with `aria-describedby`, so a screen reader reads the field and its problem together."],["Contrast","Label and helper text clear 4.5:1 on their surface in all three themes; the token build validates the pairs it ships."],["Colour independence","Error state carries a sentence as well as a stroke colour, so it survives greyscale and colour-blind viewing."]],"tokens":[{"name":"btn.primary.bg","value":"arta.sys.color.action.primary"},{"name":"btn.primary.bg-hover","value":"arta.sys.color.action.primary-hover"},{"name":"btn.primary.bg-press","value":"arta.sys.color.action.primary-press"},{"name":"btn.primary.fg","value":"arta.sys.color.text.on-action"},{"name":"btn.secondary.bg","value":"transparent"},{"name":"btn.secondary.stroke","value":"arta.sys.color.action.secondary-stroke"},{"name":"btn.secondary.fg","value":"arta.sys.color.text.primary"},{"name":"btn.radius","value":"arta.sys.radius.action"},{"name":"btn.height","value":"arta.sys.size.control"},{"name":"btn.px","value":"arta.sys.space.stack-lg"},{"name":"btn.gap","value":"arta.sys.space.inline-sm"},{"name":"btn.label-family","value":"arta.sys.type.label-caps.family"},{"name":"btn.label-weight","value":"arta.sys.type.label-caps.weight"},{"name":"btn.label-size","value":"arta.ref.font.size.300"},{"name":"btn.label-spacing","value":"arta.sys.type.label-caps.letter-spacing"},{"name": e-width","value":"arta.sys.border.default"},{"name":"input.stroke-width-focus","value":"arta.sys.border.focus"},{"name":"input.radius","value":"arta.sys.radius.control"},{"name":"input.height","value":"arta.sys.size.control"},{"name":"input.px","value":"arta.sys.space.stack-md"},{"name":"input.label-color","value":"arta.sys.color.text.secondary"},{"name":"input.label-size","value":"arta.sys.type.label-caps.size"},{"name":"input.label-spacing","value":"arta.sys.type.label-caps.letter-spacing"},{"name":"input.label-weight","value":"arta.sys.type.label-caps.weight"},{"name":"input.help-color","value":"arta.sys.color.text.tertiary"},{"name":"input.error-color","value":"arta.sys.color.text.danger"},{"name":"input.disabled-opacity","value":"arta.sys.opacity.disabled"},{"name":"input.motion","value":"arta.sys.motion.control"}],"classes":[{"name":"arta-btn","decls":11},{"name":"arta-iconbtn","decls":3},{"name":"arta-field","decls":16}]},"02-components-feedback":{"section":"02 Components","leaf":"Feedback","variants":[{"name":"Chips & indicators · Filter Chips","id":"02-components-feedback-chips-indicators--filter-chips"},{"name":"Chips & indicators · AI Voice","id":"02-components-feedback-chips-indicators--ai-voice"}],"docsId":"02-components-feedback-chips-indicators--docs","usage":{"intro":"Small surfaces that report state: filter chips, carousel position, and value-change indicators. They are the system’s quietest components and they are held to the strictest colour rule.","rules":["A change chip always carries the sign and the number, never colour alone — <b>+2.4%</b> is legible in greyscale, a green pill is not.","Filter chips show the current filter in the chip itself; there is no separate “currently showing” line to fall out of sync.","Page indicators are decorative and never the only navigation."],"states":[["Default","Resting surface."],["Selected","Filled surface plus stroke."],["Positive / negative","Status colour plus the explicit sign."]]},"style":[["Chip","Pill a-change","decls":3}]},"04-patterns-decision-outcomes":{"section":"04 Patterns","leaf":"Decision & outcomes","variants":[{"name":"All Outcomes","id":"04-patterns-decision-outcomes--all-outcomes"},{"name":"Adjusted Offer Pattern","id":"04-patterns-decision-outcomes--adjusted-offer-pattern"}],"docsId":"04-patterns-decision-outcomes--docs","usage":{"intro":"Every outcome ships a <b>next step</b> — approval is not the only designed state. The status, its prominence, and the presence of a next step are platform policy, so presenting pending as approved is structurally impossible.","rules":["A slower path is an <b>evidence path, never a verdict on the person</b>. “Additional review” names what is still being confirmed and what has already cleared — it does not imply the member is a worse risk.","A phased limit is framed as a start, not a refusal: what is available now, what raises it, and when.","A decline is private, as specific as the law allows, and carries the timeline for the written explanation — in Singapore, the specific reasons within 7 days, with a free Credit Bureau Singapore report available afterwards.","A decline screen carries <b>zero cross-sell</b>. The member is still a member.","No urgency patterns anywhere in this family: no countdowns, no “offer expires”, no pre-selected accept."],"states":[["Approved","Terms restated in writing; the card is usable immediately."],["Additional review","Timeline with what has cleared and what is outstanding; nothing for the member to do unless evidence is named."],["Action required","Exactly what is needed, with the application saved and resumable."],["Phased limit","What is available now and what would raise it."],["Declined","Reason category, written-explanation timeline, membership unchanged."]]},"style":[["Status colour","`sys.color.decision.*` — core semantics; a partner may adjust lightness for contrast but not the hue family."],["Prominence","The status sits above the headline in every state, so the outcome is read before the detail."],["Timeline","Cleared steps carry a mark and the word, so progress is legible without colour."]],"a11y":[["Announcement","The decision arrives in a live region so it is announced, not silently swapped in."],["Status by text","The chip carries the word, not only the colour."],["Next step focus","Focus moves to the next action, so a keyboard user is not stranded at the top of a result screen."],["Review timeline","Marked up as an ordered list with each step’s state in its accessible name."]],"tokens":[],"classes":[]},"01-foundations-colour":{"section":"01 Foundations","leaf":"Colour","variants":[{"name":"Reference","id":"01-foundations-colour--reference"},{"name":"System","id":"01-foundations-colour--system"},{"name":"Gradients","id":"01-foundations-colour--gradients"}],"docsId":"01-foundations-colour--docs","usage":null,"style":null,"a11y":null,"tokens":[],"classes":[]},"01-foundations-spacing-radius":{"section":"01 Foundations","leaf":"Spacing & Radius","variants":[{"name":"Spacing","id":"01-foundations-spacing-radius--spacing"},{"name":"Radius","id":"01-foundations-spacing-radius--radius"}],"docsId":"01-foundations-spacing-radius--docs","usage":null,"style":null,"a11y":null,"tokens":[],"classes":[]},"01-foundations-typography":{"section":"01 Foundations","leaf":"Typography","variants":[{"name":"Text Styles","id":"01-foundations-typography--text-styles"}],"docsId":"01-foundations-typography--docs","usage":null,"style":null,"a11y":null,"tokens":[],"classes":[]},"03-card-components-key-terms":{"section":"03 Card components","leaf":"Key Terms","variants":[{"name":"Arta Card","id":"03-card-components-key-terms--arta-card"}],"docsId":"03-card-components-key-terms--docs","usage":{"intro":"The key-terms module never folds away, and consents default unchecked and are logged. This is the compliance surface — the part a partner may restyle but never restructure.","rules":["Key terms are <b>always expanded</b>. An accordion on a fee table is a decision to hide a fee.","Each consent is separate and specific. One checkbox covering three agreements is not consent, it is a bundle.","Nothing is pre-checked, ever.","The consequence is written in plain language beside the consent — “This is a hard inquiry and may affect your credit score”, not a reference to a clause number."],"states":[["Default","Terms visible, consents unchecked."],["Consent given","Checked, logged with a timestamp."],["Full agreement open","Bottom sheet with scroll-to-read."]]},"style":[["Terms table","Term left in `text.secondary`, value right in `type.numeral` — the value is what gets compared."],["Footnote","Legal type style; size and line-height are compliance-locked minimums the build enforces."],["Checked box","`action.inverse` fill with a dark glyph — the real-app convention."]],"a11y":[["Consent semantics","Each is a real checkbox with its own label; the label is the full sentence, so the screen reader announces what is being agreed to."],["No hidden terms","Key terms are in the DOM at page load — not lazy-loaded, not behind a disclosure widget."],["Type floor","Legal text may never be rendered below `type.legal.size`; a partner theme that lowers it fails the build."]],"tokens":[{"name":"consent.box-size","value":"arta.sys.size.checkbox"},{"name":"consent.box-radius","value":"arta.ref.radius.xs"},{"name":"consent.box-stroke","value":"arta.sys.color.stroke.strong"},{"name":"consent.box-stroke-width","value":"arta.sys.border.default"},{"name":"consent.box-bg-checked","value":"arta.sys.color.action.primary"},{"name":"consent.check-fg","value":"arta.sys.color.text.on-action"},{"name":"consent.focus-ring","value":"arta.sys.color.action.focus-ring"},{"name":"consent.text-color","value":"arta.sys.color.text.legal"},{"name":"consent.text-size","value":"arta.sys.type.legal.size"},{"name":"consent.text-line-height","value":"arta.sys.type.legal.line-height"},{"name":"consent.gap","value":"arta.sys.space.inline-md"},{"name":"consent.motion","value":"arta.sys.motion.control"},{"name":"keyterms.bg","value":"arta.sys.color.surface.raised"},{"name":"keyterms.stroke","value":"arta.sys.color.stroke.subtle"},{"name":"keyterms.radius","value":"arta.sys.radius.surface"},{"name":"keyterms.pad","value":"arta.sys.space.stack-lg"},{"name":"keyterms.row-gap","value":"arta.sys.space.stack-md"},{"name":"keyterms.divider","value":"arta.sys.color.stroke.subtle"},{"name":"keyterms.term-color","value":"arta.sys.color.text.secondary"},{"name":"keyterms.term-size","value":"arta.sys.type.legal.size"},{"name":"keyterms.value-color","value":"arta.sys.color.text.primary"},{"name":"keyterms.value-family","value":"arta.sys.type.numeral.family"},{"name":"keyterms.value-size","value":"arta.ref.font.size.500"},{"name":"keyterms.value-weight","value":"arta.ref.font.weight.medium"},{"name":"keyterms.footnote-color","value":"arta.sys.color.text.legal"},{"name":"keyterms.footnote-size","value":"arta.sys.type.legal.size"},{"name":"keyterms.footnote-line-height","value":"arta.sys.type.legal.line-height"}],"classes":[{"name":"arta-keyterms","decls":7},{"name":"arta-consent","decls":6}]},"01-foundations-token-architecture":{"section":"01 Foundations","leaf":"Token architecture","variants":[{"name":"How It Works","id":"01-foundations-token-architecture--how-it-works"}],"docsId":"01-foundations-token-architecture--docs","usage":null,"style":null,"a11y":null,"tokens":[],"classes":[]},"02-components-charts":{"section":"02 Components","leaf":"Charts","variants":[{"name":"Allocation donut · With Legend Chips","id":"02-components-charts-allocation-donut--with-legend-chips"},{"name":"Allocation treemap · Hover Chip","id":"02-components-charts-allocation-treemap--hover-chip"},{"name":"Education chart · Comparison","id":"02-components-charts-education-chart--comparison"},{"name":"Decay curve · Timeline","id":"02-components-charts-decay-curve--timeline"},{"name":"Performance bars · Ten Years","id":"02-components-charts-performance-bars--ten-years"},{"name":"Peer benchmark · Card","id":"02-components-charts-peer-benchmark--card"},{"name":"Sector composition · Twin Donuts","id":"02-components-charts-sector-composition--twin-donuts"},{"name":"Stat hero","id":"02-components-charts-stat-hero--default"},{"name":"Style matrix","id":"02-components-charts-style-matrix--default"},{"name":"Line chart · With Legend","id":"02-components-charts-line-chart--with-legend"}],"docsId":"02-components-charts-allocation-donut--docs","usage":{"intro":"Ten variants, one family. The variant is chosen by <b>the question the member is asking</b> — not by what looks impressive. Every chart inherits the same encoding, labelling and colour rules.","choose":[["“What is my money made of?”","Allocation donut · Allocation treemap","Donut for ≤6 slices; treemap when weights span an order of magnitude or names must stay readable."],["“How did it do?”","Performance bars · Line chart","Bars for discrete periods; line for a continuous series where the shape of the path is the point."],["“How does it behave under stress?”","Decay curve · Drawdown table","Curves for the shape of the loss; tables when the exact number is what gets acted on."],["“Where does it sit against others?”","Style matrix · Peer benchmark · Sector composition","Position in a space, not magnitude. Never a bar chart for a two-axis question."],["“Why does this work?”","Education chart","Explanatory, not analytical — deliberately simplified and always paired with a sentence."],["One number that matters most","Stat hero","A single figure with its change; a one-bar chart is always a stat in disguise."]],"rules":["Colour encodes <b>category</b>, never <b>status</b>. Allocation colours come from the card-art gradient family; the status palette is reserved for outcomes a member must act on — so a green slice never reads as “good”.","Nothing is encoded by colour alone. Every series carries a label or a legend chip.","Figures use tabular numerals so columns align and a changing value never shifts its neighbours.","Axes start at zero for magnitude, and are clipped only when the chart is explicitly about change — with the clip stated."],"states":[["Default","Full series, legend visible."],["Loading","Skeleton at the chart’s real height — the layout never jumps when data lands."],["Empty","A sentence explaining why there is no data and what would produce some. Never an empty frame."],["Single datum","Falls back to a stat, not a one-bar chart."]]},"style":[["Category palette","`sys.gradient.card-art-*` derived hues — deliberately separate from `sys.color.status.*`."],["Legend","Chips carry the swatch and the label together; the chip is the legend, there is no separate key."],["Numerals","`sys.type.numeral` with tabular figures."],["Grid lines","Hairline `stroke.subtle`; never heavier than the data."]],"a11y":[["Non-visual equivalent","Every chart is paired with the table or the sentence that carries the same fact — the chart is an aid, not the only route to the data."],["Colour independence","Series are distinguished by label and position, so the chart reads in greyscale and to a colour-blind viewer."],["Contrast","Labels sit at 4.5:1 against their slice; small text is never placed on the lightest end of a gradient."],["Motion","Entrance animation is decorative and respects `prefers-reduced-motion`."]],"tokens":[{"name":"stat.bg","value":"arta.sys.color.surface.raised"},{"name":"stat.radius","value":"arta.sys.radius.media"},{"name":"stat.pad","value":"arta.sys.space.stack-xl"},{"name":"stat.value-color","value":"arta.sys.color.action.primary"},{"name":"stat.value-size","value":"arta.ref.font.size.1000"},{"name":"stat.value-weight","value":"arta.ref.font.weight.light"},{"name":"stat.caption-color","value":"arta.sys.color.text.secondary"},{"name":"donut.size","value":"arta.ref.size.donut"},{"name":"donut.hole","value":"arta.ref.size.donut-hole"},{"name":"donut.track","value":"arta.sys.color.surface.form"},{"name":"donut.center-value-color","value":"arta.sys.color.text.primary"},{"name":"donut.center-label-color","value":"arta.sys.color.text.tertiary"},{"name":"bars.base","value":"arta.sys.color.text.primary"},{"name":"bars.delta","value":"arta.ref.color.violet.40"},{"name":"bars.axis-color","value":"arta.sys.color.text.tertiary"},{"name":"bars.gridline","value":"arta.sys.color.stroke.subtle"},{"name":"decay.dot-bg","value":"arta.sys.color.surface.inverse"},{"name":"decay.dot-fg","value":"arta.sys.color.action.inverse-fg"},{"name":"decay.bar","value":"arta.ref.color.violet.40"},{"name":"decay.track","value":"arta.sys.color.surface.form"},{"name":"decay.value-color","value":"arta.sys.color.text.primary"},{"name":"sector.bg","value":"arta.sys.color.surface.raised"},{"name":"sector.radius","value":"arta.sys.radius.surface"},{"name":"sector.pad","value":"arta.sys.space.stack-md"},{"name":"sector.icon-bg","value":"arta.sys.color.surface.form"},{"name":"sector.control-bg","value":"arta.sys.color.action.inverse"},{"name":"sector.control-fg","value":"arta.sys.color.action.inverse-fg"},{"name":"chartline.primary","value":"arta.sys.color.action.primary"},{"name":"chartline.secondary","value":"arta.sys.color.text.tertiary"},{"name":"chartline.accent","value":"arta.ref.color.mint.50"},{"name":"chartline.grid","value":"arta.sys.color.stroke.subtle"},{"name":"chartline.label-color","value":"arta.sys.color.text.tertiary"},{"name":"treemap.tile-bg","value":"arta.sys.color.surface.form"},{"name":"treemap.tile-bg-hover","value":"arta.sys.color.surface.raised"},{"name":"treemap.tile-fg","value":"arta.sys.color.text.primary"},{"name":"treemap.gap","value":"arta.ref.space.1"},{"name":"treemap.chip-bg","value":"arta.sys.color.action.inverse"},{"name":"treemap.chip-fg","value":"arta.sys.color.action.inverse-fg"}],"classes":[{"name":"arta-donut","decls":6},{"name":"arta-donut-wrap","decls":1},{"name":"arta-treemap","decls":5},{"name":"arta-bars","decls":5},{"name":"arta-decay","decls":6},{"name":"arta-matrix","decls":5},{"name":"arta-legend","decls":5},{"name":"arta-stat","decls":3},{"name":"arta-sector","decls":6}]},"02-components-selection":{"section":"02 Components","leaf":"Selection","variants":[{"name":"Answer card","id":"02-components-selection-answer-card--states"},{"name":"Radio rows","id":"02-components-selection-radio-rows--states"},{"name":"Tilt row · Tilt States","id":"02-components-selection-tilt-row--tilt-states"},{"name":"Segmented pills · Two Rows","id":"02-components-selection-segmented-pills--two-rows"}],"docsId":"02-components-selection-answer-card--docs","usage":{"intro":"Every choose-one control in the system. The family rule is one sentence: <b>the option states its consequence, not just its label</b> — because in a lending flow the member is agreeing to an outcome, not picking a preference.","anatomy":"Trigger area · label · <b>consequence line</b> · selection indicator. The consequence line is what separates this family from a generic radio group, and it is never optional on an option that carries a legal or financial outcome.","choose":[["Two mutually exclusive answers, consequence matters","Answer card","Each answer restates what it means in a full sentence — “No, I am not a US person for tax purposes” rather than “No”."],["Two to four short, self-evident options","Segmented pills","Only when the label alone is unambiguous. If a consequence needs explaining, it is an Answer card."],["A list of options with supporting detail","Radio rows","Each row carries a sub-line — the pattern used for employment type and settlement source."],["Adjusting a value up or down per item","Tilt row","Three tilt states live in the pill label; the row itself never recolours — a tilt is data, not celebration."]],"rules":["Selection is shown by <b>stroke and fill together</b>, never by colour alone — a selected state must survive greyscale.","Nothing is pre-selected in a consequential flow. A default answer is a nudge, and a nudge on a legal question is a dark pattern.","The tap target is the whole row or card, never just the indicator.","Changing a selection never silently destroys data entered elsewhere; if it would, the control asks first."],"states":[["Default","Unselected, full-contrast label."],["Hover / focus","Stroke brightens; the focus ring is visible and never removed."],["Selected","Fill plus stroke; the consequence line stays readable, not dimmed."],["Disabled","Reduced opacity plus a reason."],["Error","Group-level message below with a coral stroke on the group — never on one unselected option."]]},"style":[["Indicator","Checked state fills with `action.inverse` and draws the glyph in `action.inverse-fg` — the real-app convention."],["Row height","Minimum 44px; rows with a sub-line grow rather than truncating it."],["Consent text","Uses the legal type style — `type.legal.size` and `line-height` are compliance-locked minimums."],["Selected fill","Never the status palette. Selection is not an outcome, so it must not borrow outcome colour."]],"a11y":[["Grouping","Options are wrapped in a `fieldset` with a `legend`, so a screen reader announces the question before the options."],["Consent controls","Each consent is an independent checkbox with its own label — never one checkbox covering several agreements."],["Default state","Nothing pre-checked, which is both an accessibility and a compliance requirement: the member must act to agree."],["Keyboard","Arrow keys move within a radio group; Tab moves between groups; Space toggles a checkbox."],["Target size","Whole row is the target — 44px minimum, verified at 320px width."]],"tokens":[{"name":"toggle.bg","value":"transparent"},{"name":"toggle.stroke","value":"arta.sys.color.stroke.on-gradient"},{"name":"toggle.fg","value":"arta.sys.color.text.on-gradient"},{"name":"toggle.selected-bg","value":"arta.sys.color.action.inverse"},{"name":"toggle.selected-fg","value":"arta.sys.color.action.inverse-fg"},{"name":"toggle.radius","value":"arta.sys.radius.action"},{"name":"toggle.height","value":"arta.sys.size.control-compact"},{"name":"toggle.px","value":"arta.sys.space.stack-md"},{"name":"radiorow.bg","value":"arta.sys.color.surface.raised"},{"name":"radiorow.fg","value":"arta.sys.color.text.secondary"},{"name":"radiorow.selected-bg","value":"arta.sys.color.status.info"},{"name":"radiorow.selected-fg","value":"arta.sys.color.text.on-gradient"},{"name":"radiorow.radius","value":"arta.sys.radius.control"},{"name":"radiorow.pad","value":"arta.sys.space.stack-md"},{"name":"seg.bg","value":"arta.sys.color.surface.raised"},{"name":"seg.radius","value":"arta.sys.radius.action"},{"name":"seg.fg","value":"arta.sys.color.text.secondary"},{"name":"seg.selected-bg","value":"arta.sys.color.action.primary"},{"name":"seg.selected-fg","value":"arta.sys.color.text.on-action"},{"name":"seg.px","value":"arta.sys.space.stack-lg"},{"name":"seg.height","value":"arta.sys.size.control-compact"},{"name":"sector.bg","value":"arta.sys.color.surface.raised"},{"name":"sector.radius","value":"arta.sys.radius.surface"},{"name":"sector.pad","value":"arta.sys.space.stack-md"},{"name":"sector.icon-bg","value":"arta.sys.color.surface.form"},{"name":"sector.control-bg","value":"arta.sys.color.action.inverse"},{"name":"sector.control-fg","value":"arta.sys.color.action.inverse-fg"},{"name":"answer.bg","value":"arta.sys.color.surface.raised"},{"name":"answer.stroke-hover","value":"arta.sys.color.stroke.strong"},{"name":"answer.radius","value":"arta.sys.radius.surface"},{"name":"answer.pad","value":"arta.sys.space.stack-lg"},{"name":"answer.label-color","value":"arta.sys.color.text.primary"},{"name":"answer.desc-color","value":"arta.sys.color.text.secondary"},{"name":"consent.box-size","value":"arta.sys.size.checkbox"},{"name":"consent.box-radius","value":"arta.ref.radius.xs"},{"name":"consent.box-stroke","value":"arta.sys.color.stroke.strong"},{"name":"consent.box-stroke-width","value":"arta.sys.border.default"},{"name":"consent.box-bg-checked","value":"arta.sys.color.action.primary"},{"name":"consent.check-fg","value":"arta.sys.color.text.on-action"},{"name":"consent.focus-ring","value":"arta.sys.color.action.focus-ring"},{"name":"consent.text-color","value":"arta.sys.color.text.legal"},{"name":"consent.text-size","value":"arta.sys.type.legal.size"},{"name":"consent.text-line-height","value":"arta.sys.type.legal.line-height"},{"name":"consent.gap","value":"arta.sys.space.inline-md"},{"name":"consent.motion","value":"arta.sys.motion.control"}],"classes":[{"name":"arta-radiorow","decls":6},{"name":"arta-seg","decls":3},{"name":"arta-answer","decls":5},{"name":"arta-sector","decls":6},{"name":"arta-toggle","decls":4},{"name":"arta-consent","decls":6}]},"02-components-catalog-cards":{"section":"02 Components","leaf":"Catalog cards","variants":[{"name":"Benefit card · Focus Dims","id":"02-components-catalog-cards-benefit-card--focus-dims"},{"name":"Fund card · Variants","id":"02-components-catalog-cards-fund-card--variants"},{"name":"Strategy card","id":"02-components-catalog-cards-strategy-card--states"},{"name":"Strategy card · Interactive","id":"02-components-catalog-cards-strategy-card--interactive"},{"name":"Theme card","id":"02-components-catalog-cards-theme-card--grid"}],"docsId":"02-components-catalog-cards-benefit-card--docs","usage":{"intro":"Arta’s product surfaces are <b>collectible cards</b> — the atomic unit a member browses, compares and picks. One card is one decidable object, and choosing one is expressed by <b>muting the others</b>, never by shouting louder.","anatomy":"Gradient art (identity) · title + qualifier · one-line tagline · optional badge · optional figure. A card that needs a paragraph is a detail page.","choose":[["A strategy or structured offering","Strategy card","Gradient art carries identity; closed vintages mute to flat grey."],["A fund with a manager and a number","Fund card","The manager name is the identity, so art is subordinate to type."],["A theme to explore, not yet an investment","Theme card","Softer art, no figures — a theme is an invitation, not an offer."],["A benefit or feature of a product","Benefit card","Icon-led, no gradient — benefits sit inside a page, they are not browsed."]],"rules":["Selection dims siblings (<code>.has-selection</code> on the grid) rather than amplifying the chosen card. Attention is directed by <b>removal</b>, which keeps a dense page calm.","Gradient art is decorative and never carries meaning — a member must never infer status from a gradient.","A closed or unavailable card goes flat grey and keeps its label; it is never hidden, because disappearing options make a catalog feel untrustworthy.","One figure per card at most. Two numbers on a card is a table in disguise."],"states":[["Default","Full art, full contrast."],["Selected","Keeps its art; siblings dim."],["Muted / closed","Flat surface fill, label retained, action removed."],["Loading","Skeleton at the card’s real aspect ratio so the grid never reflows."]]},"style":[["Art","`sys.gradient.card-art-1…3`, themed per partner. Aspect ratio is fixed so the focal point never crops."],["Radius","`radius.surface` — 18px on Arta, 12px on Northstar, 10px on Meridian."],["Dimming","Siblings drop to `surface.raised` with no gradient; the transition uses `motion.surface` (220ms)."],["Grid","Auto-fill, minimum 200px per card; two columns under 640px."]],"a11y":[["Semantics","A selectable card is a `button` or a labelled `input`, not a `div` with a click handler."],["Selection state","Communicated with `aria-pressed` or `aria-checked` — dimming is a visual convenience, not the accessible signal."],["Unavailable cards","Marked `aria-disabled` with the reason in the accessible name, so a screen-reader user learns why rather than finding a dead control."],["Contrast on art","Title and tagline sit on the darkest third of every gradient; each card art is checked at 4.5:1 for its text."]],"tokens":[{"name":"catalog.radius","value":"arta.sys.radius.media"},{"name":"catalog.pad","value":"arta.sys.space.stack-lg"},{"name":"catalog.title-size","value":"arta.ref.font.size.700"},{"name":"catalog.title-weight","value":"arta.ref.font.weight.semibold"},{"name":"catalog.tagline-color","value":"arta.sys.color.text.on-gradient-secondary"},{"name":"catalog.badge-bg","value":"arta.ref.color.alpha.white-28"},{"name":"catalog.badge-fg","value":"arta.sys.color.text.on-gradient"},{"name":"catalog.dim-bg","value":"arta.sys.color.surface.raised"},{"name":"catalog.dim-fg","value":"arta.sys.color.text.tertiary"},{"name":"benefit.radius","value":"arta.sys.radius.media"},{"name":"benefit.pad","value":"arta.sys.space.stack-lg"},{"name":"benefit.num-color","value":"arta.sys.color.text.on-gradient-secondary"},{"name":"benefit.title-color","value":"arta.sys.color.text.on-gradient"},{"name":"benefit.body-color","value":"arta.sys.color.text.on-gradient-secondary"},{"name":"benefit.dim-bg","value":"arta.sys.color.surface.raised"},{"name":"benefit.dim-fg","value":"arta.sys.color.text.tertiary"},{"name":"fund.radius","value":"arta.sys.radius.media"},{"name":"fund.pad","value":"arta.sys.space.stack-lg"},{"name":"fund.name-size","value":"arta.ref.font.size.700"},{"name":"fund.min-size","value":"arta.ref.font.size.600"},{"name":"fund.min-weight","value":"arta.ref.font.weight.semibold"},{"name":"fund.badge-bg","value":"arta.sys.color.action.inverse"},{"name":"fund.badge-fg","value":"arta.sys.color.action.inverse-fg"},{"name":"theme-card.bg","value":"arta.ref.color.alpha.white-8"},{"name":"theme-card.stroke","value":"arta.sys.color.stroke.subtle"},{"name":"theme-card.radius","value":"arta.sys.radius.media"},{"name":"theme-card.pad","value":"arta.sys.space.stack-lg"},{"name":"theme-card.title-color","value":"arta.sys.color.text.primary"},{"name":"theme-card.desc-color","value":"arta.sys.color.text.secondary"}],"classes":[{"name":"arta-catalog","decls":8},{"name":"arta-catalog-grid","decls":3},{"name":"arta-fund","decls":7},{"name":"arta-theme","decls":5},{"name":"arta-benefit","decls":7}]},"02-components-tables":{"section":"02 Components","leaf":"Tables","variants":[{"name":"Comparison table · With Context","id":"02-components-tables-comparison-table--with-context"},{"name":"Drawdown table · Events","id":"02-components-tables-drawdown-table--events"}],"docsId":"02-components-tables-comparison-table--docs","usage":{"intro":"A table is what a chart becomes when <b>the exact number is the thing being acted on</b>. If a member will make a decision on the figure, it belongs in a table — a chart is for shape, a table is for value.","choose":[["Comparing options side by side","Comparison table","Paired with a sentence of context — a table alone rarely says why the comparison matters."],["Showing loss under stress","Drawdown table","Exact percentages, because “how bad, precisely” is the question being asked."]],"rules":["Figures are right-aligned with <b>tabular numerals</b> so a column scans as a column.","Negative figures carry the sign and the status colour together — never colour alone, and never parentheses, which are ambiguous on a phone.","Tables scroll horizontally inside <code>.arta-scroll-x</code> rather than shrinking type. <b>Financial figures never shrink below the type minimum to fit a viewport.</b>","No zebra striping — row rhythm comes from spacing and hairlines, which survives theming better than alternating fills."],"states":[["Default","All rows visible."],["Scrolled","Horizontal scroll with an edge cue; headers persist."],["Loading","Row skeletons at real row height."],["Empty","A sentence explaining why, and what would populate it."]]},"style":[["Alignment","Labels left, figures right; the column edge is the reading line."],["Hairlines","`stroke.subtle` between rows, `stroke.strong` under the header."],["Type","Header uses the caps micro-label; figures use `sys.type.numeral`."]],"a11y":[["Semantics","Real `table` markup with `th` and `scope` — never a grid of divs, so screen readers can navigate by row and column."],["Scroll region","The scroll container is focusable and labelled, so a keyboard user can reach and scroll it."],["Negative values","The sign is in the text, not only in the colour."]],"tokens":[{"name":"table.header-color","value":"arta.sys.color.text.tertiary"},{"name":"table.cell-color","value":"arta.sys.color.text.primary"},{"name":"table.value-color","value":"arta.sys.color.text.primary"},{"name":"table.divider","value":"arta.sys.color.stroke.subtle"},{"name":"table.row-pad","value":"arta.sys.space.stack-md"}],"classes":[{"name":"arta-table","decls":4},{"name":"arta-scroll-x","decls":2}]},"04-patterns-human-escalation":{"section":"04 Patterns","leaf":"Human escalation","variants":[{"name":"Modal","id":"04-patterns-human-escalation--modal"}],"docsId":"04-patterns-human-escalation--docs","usage":null,"style":null,"a11y":null,"tokens":[],"classes":[]},"02-components-rows":{"section":"02 Components","leaf":"Rows","variants":[{"name":"Fact rows","id":"02-components-rows-fact-rows--rows"},{"name":"Search result rows","id":"02-components-rows-search-result-rows--rows"},{"name":"Service rows · Catalog","id":"02-components-rows-service-rows--catalog"},{"name":"Contact rows","id":"02-components-rows-contact-rows--list"}],"docsId":"02-components-rows-fact-rows--docs","usage":{"intro":"List rows carry the quiet content of a wealth product — facts, services, people, results. The family rule: <b>one row, one thing</b>. A row that carries two claims is two rows.","anatomy":"Leading marker (dim icon or avatar) · primary content · optional trailing value or action. The marker is deliberately low-contrast: the content carries the meaning, the icon only aids scanning.","choose":[["A single fact or claim about a product","Fact rows","Exactly one number or claim per row — this is what keeps a detail page scannable."],["A service the member can use","Service rows","Name plus what it does; the action lives at the row level, not inside the text."],["A named human being","Contact rows","Avatar, name, credential and a verification mark — trust attaches to a person, not a department."],["A result the member is choosing from","Search result rows","Hover affordance required; the row is a target, so it must announce that it is one."]],"rules":["Verification is shown by an explicit mark <b>plus the word</b> — “✓ Verified”, never a colour or a badge alone.","Trailing values use tabular numerals and right alignment so a column of rows scans vertically.","A row is either informational or interactive, never ambiguously both.","Avatars and icons never carry status meaning — a person’s photo is identity, not availability."],"states":[["Default","Resting contrast."],["Hover / focus","Interactive rows only — surface lifts, focus ring visible."],["Empty","A sentence, not a blank list."]]},"style":[["Marker","Dim circle at `text.tertiary`; never the accent colour, which would compete with the content."],["Divider","Hairline `stroke.subtle` between rows; no divider after the last row."],["Verification","`status.positive` for the mark, with the word alongside."]],"a11y":[["Interactive rows","Rendered as `a` or `button` so they are reachable and announced as targets."],["Decorative icons","Marked `aria-hidden` — they add no information a screen reader needs."],["Verification","The word “Verified” is in the accessible name, not conveyed by the icon alone."]],"tokens":[{"name":"fact.icon-size","value":"arta.ref.space.10"},{"name":"fact.icon-bg","value":"arta.sys.color.status.info-surface"},{"name":"fact.icon-fg","value":"arta.sys.color.status.info"},{"name":"fact.text-color","value":"arta.sys.color.text.secondary"},{"name":"fact.gap","value":"arta.sys.space.inline-md"},{"name":"contact.avatar-size","value":"arta.ref.size.avatar"},{"name":"contact.avatar-bg","value":"arta.sys.color.surface.form"},{"name":"contact.name-color","value":"arta.sys.color.text.primary"},{"name":"contact.badge-color","value":"arta.sys.color.text.tertiary"},{"name":"contact.divider","value":"arta.sys.color.stroke.subtle"},{"name":"service.bg","value":"arta.sys.color.surface.raised"},{"name":"service.radius","value":"arta.sys.radius.surface"},{"name":"service.pad","value":"arta.sys.space.stack-md"},{"name":"service.tile-size","value":"arta.ref.space.12"},{"name":"service.tile-radius","value":"arta.ref.radius.sm"},{"name":"service.tile-fg","value":"arta.sys.color.text.on-gradient"},{"name":"service.title-color","value":"arta.sys.color.text.primary"},{"name":"service.desc-color","value":"arta.sys.color.text.secondary"}],"classes":[{"name":"arta-fact","decls":4},{"name":"arta-facts","decls":1},{"name":"arta-service","decls":5},{"name":"arta-contact","decls":5}]},"04-patterns-ai-prompt-entry":{"section":"04 Patterns","leaf":"AI prompt entry","variants":[{"name":"Chips","id":"04-patterns-ai-prompt-entry--chips"}],"docsId":"04-patterns-ai-prompt-entry--docs","usage":null,"style":null,"a11y":null,"tokens":[],"classes":[]},"03-card-components-explained-takeaway":{"section":"03 Card components","leaf":"Explained takeaway","variants":[{"name":"Three Columns","id":"03-card-components-explained-takeaway--three-columns"}],"docsId":"03-card-components-explained-takeaway--docs","usage":null,"style":null,"a11y":null,"tokens":[],"classes":[]},"02-components-progress":{"section":"02 Components","leaf":"Progress","variants":[{"name":"Wizard steps","id":"02-components-progress-wizard-steps--states"}],"docsId":"02-components-progress-wizard-steps--docs","usage":{"intro":"Long flows need to answer three questions at a glance: where am I, how much is left, and can I leave. The stepper answers all three — which is why the application uses <b>named chapters</b> rather than a percentage bar.","rules":["Steps are <b>named, not numbered alone</b> — “Confirm · Income · Pledge · Review” tells a member what is coming; “Step 2 of 4” does not.","Completed steps stay reachable. A flow the member cannot walk back through is a flow they will abandon rather than risk.","Progress never implies a promise: reaching the last step is not approval."],"states":[["Done","Filled marker, label at full contrast, reachable."],["Current","Accent marker, label at full contrast."],["To do","Hollow marker, label dimmed, not reachable."]]},"style":[["Marker","Current step uses `action.primary`; done uses `status.positive`; to-do uses `stroke.strong`."],["Labels","Caps micro-label, wrapping rather than truncating."]],"a11y":[["Semantics","An ordered list with the current step marked `aria-current=\"step\"`."],["State by text","Completed and current states are announced in the accessible name, not conveyed by colour alone."]],"tokens":[{"name":"wizard.done-bg","value":"arta.sys.color.action.inverse"},{"name":"wizard.done-fg","value":"arta.sys.color.action.inverse-fg"},{"name":"wizard.current-color","value":"arta.sys.color.text.primary"},{"name":"wizard.todo-color","value":"arta.sys.color.text.tertiary"},{"name":"wizard.ring","value":"arta.sys.color.stroke.strong"}],"classes":[{"name":"arta-wizard","decls":6}]},"03-card-components-recommended-limit":{"section":"03 Card components","leaf":"Recommended limit","variants":[{"name":"Arta Default","id":"03-card-components-recommended-limit--arta-default"},{"name":"Northstar Theme","id":"03-card-components-recommended-limit--northstar-theme"},{"name":"Explanation Open","id":"03-card-components-recommended-limit--explanation-open"},{"name":"Additional Review","id":"03-card-components-recommended-limit--additional-review"},{"name":"Loading Decision","id":"03-card-components-recommended-limit--loading-decision"}],"docsId":"03-card-components-recommended-limit--docs","usage":{"intro":"The card’s headline surface: what Arta believes this member’s portfolio may support. The design problem is not the arithmetic — <b>the credit policy is Credit, Risk and Legal’s to define, not a designer’s to invent</b>. So this pattern is about showing what a recommendation rests on, and being visibly honest about the parts that are not yet decided.","anatomy":"Figure · what it rests on (the assets included) · an explanation entry point (“How does securing the card work?”) · the terms that govern change. No arithmetic is shown, because none has been agreed.","rules":["The number is a <b>recommendation</b>, never a promise. Language is “what your portfolio may support”, not “your limit is”.","Show what it rests on, not a formula. Assets are marked <b>Included</b>; no advance rate, no multiplier, no computed total — inventing those would put a fictional credit policy in front of a member.","Where policy is undefined, the explanation says so. The securing drawer is labelled <b>illustrative, to be defined with Credit, Risk and Legal</b> — a design system that hides its own open questions is not documentation, it is decoration.","Consequences point at the governing document, not at an invented number: “limit may adjust, with notice — see the Security Agreement for exact terms”. <b>No fabricated notice period, no promise about what happens to assets.</b>","Pre-qualification uses only what Arta already holds; no credit pull happens before submission, and the surface says so."],"states":[["Recommendation","The figure with the assets it rests on."],["Explanation open","The securing drawer, marked illustrative pending policy."],["Additional review","The figure is withheld rather than guessed; the evidence needed is named."],["Loading","Skeleton at real height while eligible assets are read."]]},"style":[["Figure","`sys.color.credit.limit-recommended` on `type.numeral` — the largest number on the screen, and the only one."],["Terms rows","Key Terms module; the change-of-limit row sits with the other terms, not in a separate risk panel."],["Reserved tokens","`portfolio.buffer-healthy` / `buffer-warning` are declared but <b>deliberately unused</b>: a collateral-health indicator needs a risk model that does not exist yet. They are kept as the slot that model would fill."]],"a11y":[["Reading order","The basis precedes the figure in the DOM, so a screen reader hears what the number rests on before the number itself."],["Not a guarantee","The word “recommended” is in the accessible name of the figure, so the hedge is never carried by visual styling alone."],["Explanation entry","A labelled button (“How does securing the card work?”), reachable by keyboard and never an icon alone."],["Terms text","Real text in the DOM at the legal type minimum — never an image, never behind a hover."]],"tokens":[{"name":"keyterms.bg","value":"arta.sys.color.surface.raised"},{"name":"keyterms.stroke","value":"arta.sys.color.stroke.subtle"},{"name":"keyterms.radius","value":"arta.sys.radius.surface"},{"name":"keyterms.pad","value":"arta.sys.space.stack-lg"},{"name":"keyterms.row-gap","value":"arta.sys.space.stack-md"},{"name":"keyterms.divider","value":"arta.sys.color.stroke.subtle"},{"name":"keyterms.term-color","value":"arta.sys.color.text.secondary"},{"name":"keyterms.term-size","value":"arta.sys.type.legal.size"},{"name":"keyterms.value-color","value":"arta.sys.color.text.primary"},{"name":"keyterms.value-family","value":"arta.sys.type.numeral.family"},{"name":"keyterms.value-size","value":"arta.ref.font.size.500"},{"name":"keyterms.value-weight","value":"arta.ref.font.weight.medium"},{"name":"keyterms.footnote-color","value":"arta.sys.color.text.legal"},{"name":"keyterms.footnote-size","value":"arta.sys.type.legal.size"},{"name":"keyterms.footnote-line-height","value":"arta.sys.type.legal.line-height"}],"classes":[{"name":"arta-keyterms","decls":7}]},"04-patterns-confirm-don-t-collect":{"section":"04 Patterns","leaf":"Confirm, don’t collect","variants":[{"name":"Confirm Dont Collect","id":"04-patterns-confirm-don-t-collect--confirm-dont-collect"}],"docsId":"04-patterns-confirm-don-t-collect--docs","usage":{"intro":"Arta already KYC’d this member, so an application should not read like a stranger’s form. The pattern has three moves in order: <b>confirm</b> what Arta holds, <b>verify</b> what it can prove through a trusted source, and <b>ask</b> only what neither can supply.","anatomy":"Verified value as text (not a filled input) · its source · an edit path · and, where a third party can prove something, a verification choice.","choose":[["Arta already holds it and it rarely changes","Confirm — review card","Name, date of birth, citizenship. Shown as text with “Verified at onboarding”, because a filled field invites editing while a review card invites confirming."],["A trusted source can prove it","Verify — Singpass / Myinfo","Income is the case that matters: Arta knows who you are, Singpass proves what you earn. The member authorises named attributes and gets a decision the same day."],["Nobody can supply it but the member","Ask","Employment status, the assets to pledge, the settlement source. These are the only genuinely new questions."]],"rules":["Verified data is <b>text, not a pre-filled input</b> — the visual form should match the ask.","The source is always named: “Verified at onboarding”, “From your Myinfo profile”. Data that appears without provenance reads as surveillance.","Verification is a <b>choice, not a requirement</b>: the member may verify through Singpass or upload a document instead. Both paths reach a decision; only the speed differs.","Consent to a verification names the attributes <b>before</b> authorisation, not after — the member sees exactly what will be read.","Editing a sensitive field states the re-verification consequence before it happens, not after."],"states":[["Verified","Text plus source and an edit affordance."],["Verify offered","Two routes, neither pre-selected, with the trade-off stated."],["Edited","Field becomes an input; the re-verification notice appears inline."]]},"style":[["Value","`text.primary` at body size — deliberately not styled like an input."],["Source","`status.positive` mark with the word alongside; never a bare icon."],["Edit","`action.primary` text button, never a pencil glyph alone."]],"a11y":[["Read vs edit","The read state is not a disabled input — disabled fields are skipped by some screen readers, which would hide the data entirely."],["Edit affordance","A labelled button (“Edit legal name”), so the target is clear out of context."],["Verification consent","The attribute list is real text before the authorising control, so it is read before it is agreed to."]],"tokens":[{"name":"review-card.bg","value":"arta.sys.color.surface.raised"},{"name":"review-card.stroke","value":"arta.sys.color.stroke.subtle"},{"name":"review-card.radius","value":"arta.sys.radius.surface"},{"name":"review-card.pad","value":"arta.sys.space.stack-md"},{"name":"review-card.label-color","value":"arta.sys.color.text.tertiary"},{"name":"review-card.value-color","value":"arta.sys.color.text.primary"},{"name":"review-card.edit-color","value":"arta.sys.color.action.primary"},{"name":"review-card.verified-color","value":"arta.sys.color.status.positive"}],"classes":[{"name":"arta-review","decls":6}]},"01-foundations-semantic-tokens":{"section":"01 Foundations","leaf":"Semantic tokens","variants":[{"name":"Generic Semantics","id":"01-foundations-semantic-tokens--generic-semantics"},{"name":"Card Domain Semantics","id":"01-foundations-semantic-tokens--card-domain-semantics"}],"docsId":"01-foundations-semantic-tokens--docs","usage":null,"style":null,"a11y":null,"tokens":[],"classes":[]},"05-white-label-system-governance-configuration":{"section":"05 White-Label System","leaf":"Governance & configuration","variants":[{"name":"Configuration Model","id":"05-white-label-system-governance-configuration--configuration-model"},{"name":"Governance In CI","id":"05-white-label-system-governance-configuration--governance-in-ci"},{"name":"Token Constraints","id":"05-white-label-system-governance-configuration--token-constraints"},{"name":"What Partners Cannot Change","id":"05-white-label-system-governance-configuration--what-partners-cannot-change"},{"name":"Component Inventory","id":"05-white-label-system-governance-configuration--component-inventory"}],"docsId":"05-white-label-system-governance-configuration--docs","usage":null,"style":null,"a11y":null,"tokens":[],"classes":[]},"05-white-label-system-compare-brands":{"section":"05 White-Label System","leaf":"Compare brands","variants":[{"name":"Side By Side","id":"05-white-label-system-compare-brands--side-by-side"}],"docsId":"05-white-label-system-compare-brands--docs","usage":null,"style":null,"a11y":null,"tokens":[],"classes":[]}};

  overview: { leaf: 'Overview & principles', html: `
    <div class="crumb">Arta Card System</div>
    <h1>A focused extension to Arta's product system</h1>
    <p class="desc">For <strong>portfolio-secured card applications, decisioning, AI guidance, and partner-brand configuration</strong>. Every family page is structured the way a system is actually used — <strong>Usage</strong> for the decision, <strong>Style</strong> for the spec, <strong>Code</strong> for the API, <strong>Accessibility</strong> for the part that gets skipped. Live demos embed the real Storybook story, and this page list is generated from the Storybook build, so nothing here can drift.</p>
    <div class="stats">
      <div class="stat"><b>154</b><span>Reference tokens</span></div>
      <div class="stat"><b>122</b><span>Semantic tokens</span></div>
      <div class="stat"><b>256</b><span>Component tokens</span></div>
      <div class="stat"><b>25</b><span>Families</span></div>

    </div>
    <h2>System principles</h2>

      <div class="pcard"><div class="n">03</div><b>Brand flexibility within financial guardrails</b><p>Partners express their brand freely — the integrity of consequential financial decisions is not configurable.</p></div>
    </div>
    <h2>Token architecture</h2>

    <div class="sw-grid"><div class="sw"><div class="sw-chip" style="background:var(--arta-sys-color-surface-app)"></div>
      <div class="sw-meta"><b>surface.app</b><code>arta.ref.color.neutral.85</code></div></div><div class="sw"><div class="sw-chip" style="background:var(--arta-sys-color-surface-raised)"></div>

      <div class="sw-meta"><b>action.primary</b><code>arta.ref.color.sky.40</code></div></div><div class="sw"><div class="sw-chip" style="background:var(--arta-sys-color-text-link)"></div>
      <div class="sw-meta"><b>text.link</b><code>arta.ref.color.sky.40</code></div></div><div class="sw"><div class="sw-chip" style="background:var(--arta-sys-color-status-warning)"></div>
      <div class="sw-meta"><b>status.warning</b><code>arta.ref.color.amber.40</code></div></div><div class="sw"><div class="sw-chip" style="background:var(--arta-sys-color-text-ai)"></div>
      <div class="sw-meta"><b>text.ai</b><code>arta.ref.color.mint.50</code></div></div></div>
    <p class="desc" style="margin-top:14px">Switch the theme above and every embedded demo re-resolves through the partner's token file — while the card-domain semantics stay locked.</p>` },
  'whats-new': { leaf: "What's new for lending", html: `

const md = (t) => String(t).replace(/`([^`]+)`/g, '<code>$1</code>');
const provOf = (k) => (EXTENDED.has(k) ? 'extended' : TODAY.has(k) ? 'today' : 'new');

function buildNav() {
  let h = '<div class="nav-sec">System</div>' +
    Object.entries(NARRATIVE).map(([k, n]) => `<a href="#${k}" data-key="${k}">${n.leaf}</a>`).join('');
  for (const sec of NAV) {
    h += `<div class="nav-sec">${sec.section}</div>` +
      sec.items.map((i) => `<a href="#${i.key}" data-key="${i.key}">${i.leaf}</a>`).join('');
  }
  document.getElementById('nav').innerHTML = h;
}

function demoBlock(p, key) {
  const vi = variantState[key] ?? 0;
  const v = p.variants[vi] || p.variants[0];
  if (!v) return '';
  return `
    <div class="demo-bar">
      <label for="vsel">Live demo</label>
      ${p.variants.length > 1
        ? `<select id="vsel">${p.variants.map((x, i) => `<option value="${i}"${i === vi ? ' selected' : ''}>${x.name}</option>`).join('')}</select>`
        : `<span style="font-size:12.5px;color:var(--doc-dim)">${v.name}</span>`}
      <span class="sp"><a class="deep" href="storybook/index.html?path=/story/${encodeURIComponent(v.id)}" target="_blank">Open in Storybook ↗</a></span>
    </div>
    <div class="frame"><iframe id="sbframe" src="storybook/iframe.html?id=${encodeURIComponent(v.id)}&globals=theme:${theme}&fit=1" title="${p.leaf} — ${v.name}"></iframe></div>`;
}

function usageTab(p, key) {
  const u = p.usage;
  if (!u) {
    return demoBlock(p, key) +
      `<p class="desc" style="margin-top:22px">Written usage guidance is authored for the lending-critical families first. The demo above is the live component; its states and copyable markup are in <a class="deep" href="storybook/index.html?path=/story/${encodeURIComponent(p.variants[0] ? p.variants[0].id : '')}" target="_blank">Storybook ↗</a>.</p>`;
  }
  return `
    <p class="desc">${md(u.intro)}</p>
    ${demoBlock(p, key)}
    ${u.anatomy ? `<h2>Anatomy</h2><div class="blk">${md(u.anatomy)}</div>` : ''}
    ${u.choose ? `<h2>Choosing the variant</h2><div class="blocks">${u.choose.map(([q, v, w]) => `<div class="choose"><div class="q">${q}</div><div class="v">${v}</div><div class="w">${md(w)}</div></div>`).join('')}</div>` : ''}
    ${u.rules ? `<h2>Rules the family holds</h2><div class="blocks">${u.rules.map((r) => `<div class="blk">${md(r)}</div>`).join('')}</div>` : ''}
    ${u.states ? `<h2>States</h2><table class="dt"><tr><th>State</th><th>Behaviour</th></tr>${u.states.map(([n, d]) => `<tr><td>${n}</td><td>${md(d)}</td></tr>`).join('')}</table>` : ''}`;
}

function styleTab(p) {
  const spec = p.style
    ? `<h2>Specification</h2><table class="dt"><tr><th>Aspect</th><th>Spec</th></tr>${p.style.map(([a, s]) => `<tr><td>${a}</td><td>${md(s)}</td></tr>`).join('')}</table>`
    : '';
  const toks = p.tokens.length
    ? `<h2>Component tokens</h2><p class="desc">Generated from the token build — the contracts this family consumes. Each resolves through the active theme; none may be hardcoded.</p>
       <table class="dt"><tr><th>Token</th><th>Resolves to</th></tr>${p.tokens.map((t) => `<tr><td><code>cmp.${t.name}</code></td><td><code>${t.value}</code></td></tr>`).join('')}</table>`
    : '';
  if (!spec && !toks) return `<div class="empty">No separate style specification — this family inherits the foundations directly.</div>`;
  return spec + toks;
}

function codeTab(p) {
  const cls = p.classes.length
    ? `<h2>Class API</h2><p class="desc">The classes this family ships, checked against <code>src/components.css</code> at build time — a renamed class fails the docs build rather than misleading you here.</p>
       <table class="dt"><tr><th>Class</th><th>Defined in components.css</th></tr>${p.classes.map((c) => `<tr><td><code>.${c.name}</code></td><td>${c.decls} rule${c.decls === 1 ? '' : 's'}</td></tr>`).join('')}</table>`
    : '';
  const consume = `<h2>Consuming it</h2><div class="blk">Include <code>dist/tokens.css</code> then <code>src/components.css</code>, and put a theme class on any ancestor — <code>theme-arta</code>, <code>theme-meridian</code> or <code>theme-northstar</code>. Components read tokens only, so swapping a theme needs no component changes.</div>`;
  const sb = p.docsId
    ? `<h2>Copyable markup</h2><div class="blk">Each state ships a copyable HTML snippet in its Storybook docs page, alongside the live controls. <a class="deep" href="storybook/index.html?path=/docs/${encodeURIComponent(p.docsId)}" target="_blank">Open the API docs ↗</a></div>`
    : '';
  return cls + consume + sb;
}

function a11yTab(p) {
  const floor = `<h2>Platform floor</h2><div class="blk">Applies to every component regardless of family: <b>visible focus</b> that a theme may recolour but not remove · <b>44px minimum targets</b> · <b>4.5:1 text contrast</b> in all three themes · <b>no meaning carried by colour alone</b>. The token build rejects a partner theme that breaks any of these.</div>`;
  if (!p.a11y) return floor + `<div class="empty" style="margin-top:14px">Family-specific requirements are authored for the lending-critical families first.</div>`;
  return floor + `<h2>Family requirements</h2><table class="dt"><tr><th>Requirement</th><th>How it is met</th></tr>${p.a11y.map(([n, d]) => `<tr><td>${n}</td><td>${md(d)}</td></tr>`).join('')}</table>`;
}

const ALL = { usage: usageTab, style: styleTab, code: codeTab, a11y: a11yTab, overview: usageTab, tokens: styleTab };
/* Carbon uses a different tab set per section, because a colour page and a button page are not
   answering the same questions. A foundation asks what/how/tokens/ship; a component asks
   when/looks/API/accessible; a pattern is prose and gets one page, no tabs. */
const TAB_SETS = {
  '01 Foundations': [['overview', 'Overview'], ['usage', 'Usage'], ['tokens', 'Tokens'], ['code', 'Code']],
  '02 Components': [['usage', 'Usage'], ['style', 'Style'], ['code', 'Code'], ['a11y', 'Accessibility']],
  '03 Card components': [['usage', 'Usage'], ['style', 'Style'], ['code', 'Code'], ['a11y', 'Accessibility']],
  '04 Patterns': [],
  '05 White-Label System': [],
  '06 Scenarios': [],
};
const tabsFor = (section) => TAB_SETS[section] ?? [['usage', 'Usage'], ['style', 'Style'], ['code', 'Code'], ['a11y', 'Accessibility']];

function render() {
  const key = location.hash.slice(1) || 'overview';
  document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('on', a.dataset.key === key));
  const main = document.getElementById('page');

  if (NARRATIVE[key]) {
    main.innerHTML = `<div class="page-body">${NARRATIVE[key].html}</div>`;
    window.scrollTo(0, 0);
    return;
  }
  const p = PAGES[key];
  if (!p) { location.hash = 'overview'; return; }
  const tabs = tabsFor(p.section);
  const tab = tabState[key] ?? (tabs[0] ? tabs[0][0] : 'usage');
  const body = tabs.length
    ? ALL[tab](p, key)
    : [usageTab(p, key), (p.style || p.tokens.length) ? styleTab(p) : '', p.a11y ? a11yTab(p) : ''].filter(Boolean).join('');

  main.innerHTML = `
    <div class="page-head${tabs.length ? '' : ' notabs'}">
      <div class="crumb">${p.section}</div>
      <h1>${p.leaf} <span class="prov ${provOf(key)}">${PROV_LABEL[provOf(key)]}</span></h1>
      ${tabs.length ? `<div class="ptabs">${tabs.map(([id, label]) => `<button data-tab="${id}" class="${id === tab ? 'on' : ''}">${label}</button>`).join('')}</div>` : ''}
    </div>
    <div class="page-body">${body}</div>`;
  window.scrollTo(0, 0);

  main.querySelectorAll('.ptabs button').forEach((b) =>
    b.addEventListener('click', () => { tabState[key] = b.dataset.tab; render(); }));
  const sel = document.getElementById('vsel');
  if (sel) sel.addEventListener('change', () => { variantState[key] = +sel.value; render(); });
  fitFrame();
}

/* Story content grows after load (fonts, charts), so track it rather than measuring once.
   The embedded preview opts out of its full-viewport canvas via ?fit=1 — otherwise the
   measurement feeds back into itself and the frame grows without end. */
function fitFrame() {
  const f = document.getElementById('sbframe');
  if (!f) return;
  const fit = () => {
    try {
      const d = f.contentDocument;
      if (!d || !d.body) return;
      const h = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight, d.body.offsetHeight);
      const next = Math.min(h + 24, 4000);
      if (h > 60 && Math.abs(next - f.clientHeight) > 8) f.style.height = next + 'px';
    } catch (e) {}
  };
  f.addEventListener('load', () => {
    fit();
    try {
      const d = f.contentDocument;
      new ResizeObserver(fit).observe(d.body);
      if (d.fonts && d.fonts.ready) d.fonts.ready.then(fit);
    } catch (e) {}
    [80, 300, 900].forEach((t) => setTimeout(fit, t));
  });
}

window.addEventListener('hashchange', render);
buildNav();
render();
</script>
