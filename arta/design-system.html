/* ===== docs shell — deliberately outside the token system so chrome never re-themes ===== */
:root{--doc-bg:#101010;--doc-panel:#161616;--doc-text:#f4f2ee;--doc-dim:#9a9a94;--doc-faint:#6b6b66;--doc-line:rgba(255,255,255,.09);--doc-sky:#a8d8f0;
--doc-aurora:linear-gradient(115deg,#f0a8c0 0%,#f5b880 22%,#c9b8f0 48%,#9fe8d0 74%,#a8d8f0 100%)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Avenir Next",Avenir,"Century Gothic",Futura,-apple-system,sans-serif;background:var(--doc-bg);color:var(--doc-text);-webkit-font-smoothing:antialiased}
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;height:58px;background:rgba(16,16,16,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--doc-line);display:flex;align-items:center;gap:18px;padding:0 24px}
.topbar a.tl{color:var(--doc-faint);text-decoration:none;font-size:12px}
.topbar a.tl:hover{color:var(--doc-text)}
.topbar .t{font-size:15px;font-weight:600}
.topbar .t em{font-style:normal;background:var(--doc-aurora);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.theme-switch{margin-left:auto;display:flex;align-items:center;gap:10px}
.theme-switch .lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--doc-faint)}
.theme-switch .seg{display:flex;border:1px solid var(--doc-line);border-radius:99px;overflow:hidden}
.theme-switch button{font-family:inherit;font-size:11.5px;background:none;border:none;color:var(--doc-dim);padding:7px 15px;cursor:pointer}
.theme-switch button.on{background:#f4f2ee;color:#111;font-weight:600}
.layout{display:flex;padding-top:58px}
aside{width:266px;flex:0 0 266px;position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;border-right:1px solid var(--doc-line);background:var(--doc-panel);padding:14px 10px 60px}
.nav-sec{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--doc-faint);padding:16px 14px 6px}
aside a{display:block;padding:6px 14px;border-radius:8px;color:var(--doc-dim);text-decoration:none;font-size:12.5px;line-height:1.45}
aside a:hover{background:rgba(255,255,255,.05);color:var(--doc-text)}
aside a.on{background:rgba(91,91,214,.2);color:var(--doc-text)}
main{flex:1;min-width:0;padding:40px 52px 100px;max-width:1120px}
.crumb{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--doc-faint);margin-bottom:10px}
h1{font-size:32px;font-weight:500;letter-spacing:-.01em;line-height:1.15}
h1.hero{font-size:42px}
.prov{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;border-radius:99px;padding:5px 11px;vertical-align:8px;font-weight:600}
.prov.today{color:#7fd6a4;border:1px solid rgba(127,214,164,.4)}
.prov.new{color:#f0b8d0;border:1px solid rgba(240,184,208,.4)}
.prov.extended{color:#a8d8f0;border:1px solid rgba(168,216,240,.4)}
h2{font-size:20px;font-weight:600;margin:34px 0 8px}
p.desc{margin-top:12px;font-size:14px;color:var(--doc-dim);line-height:1.68;max-width:72ch}
p.desc strong,p.desc b{color:var(--doc-text);font-weight:600}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--doc-sky)}
a.deep{color:var(--doc-sky);text-decoration:none}
a.deep:hover{text-decoration:underline}
/* state tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px;border-bottom:1px solid var(--doc-line);padding-bottom:0}
.tabs button{font-family:inherit;font-size:12.5px;background:none;border:none;border-bottom:2px solid transparent;color:var(--doc-dim);padding:9px 14px;cursor:pointer;margin-bottom:-1px}
.tabs button:hover{color:var(--doc-text)}
.tabs button.on{color:var(--doc-text);border-bottom-color:var(--doc-sky)}
.frame{margin-top:0;border:1px solid var(--doc-line);border-top:none;border-radius:0 0 14px 14px;overflow:hidden;background:#141414}
.frame iframe{width:100%;border:0;display:block;min-height:420px}
.frame-foot{display:flex;gap:14px;align-items:center;padding:10px 16px;border-top:1px solid var(--doc-line);font-size:11.5px;color:var(--doc-faint)}
.frame-foot a{color:var(--doc-sky);text-decoration:none}
/* overview bits */
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:26px}
.stat b{display:block;font-size:30px;font-weight:300;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--doc-faint)}
.pcards{display:flex;gap:14px;flex-wrap:wrap;margin-top:24px}
.pcard{flex:1;min-width:236px;background:var(--doc-panel);border:1px solid var(--doc-line);border-radius:14px;padding:18px}
.pcard .n{font-size:10px;letter-spacing:.16em;color:var(--doc-faint)}
.pcard b{display:block;font-size:15px;margin:6px 0 8px}
.pcard p{font-size:12.5px;line-height:1.6;color:var(--doc-dim)}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:18px}
.sw{border-radius:10px;overflow:hidden;border:1px solid var(--doc-line)}
.sw-chip{height:52px}
.sw-meta{background:var(--doc-panel);padding:8px 10px;font-size:11px}
.sw-meta b{display:block;font-weight:600}
.sw-meta code{display:block;color:var(--doc-faint);font-size:9.5px;margin-top:3px;word-break:break-all}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:18px}
.tile{background:var(--doc-panel);border:1px solid var(--doc-line);border-radius:14px;padding:16px}
.tile b{display:block;font-size:14px;margin-bottom:6px}
.tile p{font-size:12.5px;line-height:1.6;color:var(--doc-dim)}
pre.tree{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.75;color:var(--doc-dim);margin:8px 0 0}
@media(max-width:900px){aside{display:none}main{padding:28px 18px 70px}}
</style>
</head>

/* ---------- nav ---------- */
function buildNav() {
  const el = document.getElementById('nav');
  let h = '<div class="nav-sec">System</div>' +
    NARRATIVE.map((n) => `<a href="#${n.key}" data-key="${n.key}">${n.leaf}</a>`).join('');
  for (const sec of NAV) {
    h += `<div class="nav-sec">${sec.section}</div>` +
      sec.items.map((i) => `<a href="#${i.key}" data-key="${i.key}">${i.leaf}</a>`).join('');
  }
  el.innerHTML = h;
}

/* ---------- render ---------- */
let activeState = {};
function render() {
  const key = location.hash.slice(1) || 'overview';
  document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('on', a.dataset.key === key));
  const main = document.getElementById('page');

  if (DOC_PAGES[key]) { main.innerHTML = DOC_PAGES[key].html; main.scrollIntoView(); window.scrollTo(0,0); return; }

  const p = PAGES[key];
  if (!p) { location.hash = 'overview'; return; }
  const stateIdx = activeState[key] ?? 0;
  const state = p.states[stateIdx] || p.states[0];

  main.innerHTML = `
    <div class="crumb">${p.section}</div>
    <h1>${p.leaf}${p.section === '00 Overview' ? '' : ' <span class="prov ' + p.prov + '">' + PROV_LABEL[p.prov] + '</span>'}</h1>
    ${p.note ? `<p class="desc">${p.note}</p>` : ''}
    <div class="tabs">${p.states.map((s, i) => `<button data-i="${i}" class="${i === stateIdx ? 'on' : ''}">${s.name}</button>`).join('')}</div>
    <div class="frame">
      <iframe id="sbframe" src="storybook/iframe.html?id=${encodeURIComponent(state.id)}&globals=theme:${theme}&fit=1" title="${p.leaf} — ${state.name}"></iframe>
      <div class="frame-foot">
        <span>Live story · theme <b style="color:var(--doc-text)">${theme.replace('theme-','')}</b></span>
        <a href="storybook/index.html?path=/story/${encodeURIComponent(state.id)}" target="_blank">Open in Storybook ↗</a>
      </div>
    </div>`;
  window.scrollTo(0, 0);

  main.querySelectorAll('.tabs button').forEach((b) =>
    b.addEventListener('click', () => { activeState[key] = +b.dataset.i; render(); })
  );
  /* Story content can grow after load (fonts, charts, images), so track it rather than
     measuring once — a rules page that gets clipped is worse than no page. */
  const f = document.getElementById('sbframe');
  const fit = () => {
    try {
      const d = f.contentDocument;
      if (!d || !d.body) return;
      const h = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight, d.body.offsetHeight);
      const next = Math.min(h + 24, 4000);
      if (h > 80 && Math.abs(next - f.clientHeight) > 8) f.style.height = next + 'px';
    } catch (e) { /* cross-origin: keep min-height */ }
  };
  f.addEventListener('load', () => {
    fit();
    try {
      const d = f.contentDocument;
      new ResizeObserver(fit).observe(d.body);
      if (d.fonts && d.fonts.ready) d.fonts.ready.then(fit);
    } catch (e) {}
    [80, 300, 900].forEach((t) => setTimeout(fit, t));
  });
}

document.querySelectorAll('.theme-switch button').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.theme-switch button').forEach((b) => b.classList.remove('on'));
    btn.classList.add('on');
    theme = btn.dataset.theme;
    render();
  });
});

window.addEventListener('hashchange', render);
buildNav();
render();
</script>
